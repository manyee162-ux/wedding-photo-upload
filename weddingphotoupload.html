<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yi Thing & Elaine's Wedding - Photo Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #F3CFCE;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
        .custom-btn {
            background: linear-gradient(135deg, #F09CAF 0%, #F1ADB9 100%);
        }
        .custom-btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <!-- 语言切换按键 -->
    <div class="absolute top-4 right-4 bg-white/80 backdrop-blur-sm rounded-full px-3 py-1 shadow-sm flex items-center space-x-2 text-xs font-medium text-gray-700 z-10">
        <button onclick="setLang('zh')" id="lang-zh" class="px-2 py-1 rounded-full bg-pink-400 text-white transition-all">中文</button>
        <button onclick="setLang('en')" id="lang-en" class="px-2 py-1 rounded-full text-gray-600 transition-all">EN</button>
    </div>

    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-xl overflow-hidden p-6 sm:p-8 border border-white/40">
        <!-- 标题区 -->
        <div class="text-center mb-6">
            <span class="text-xs uppercase tracking-widest text-pink-500 font-semibold mb-1 block" data-i18n="subtitle">Wedding Memories</span>
            <h1 class="serif-font text-3xl font-bold text-gray-800 mb-2">Yi Thing & Elaine</h1>
            <p class="text-sm text-gray-600" data-i18n="desc">欢迎分享您的美好瞬间，留下祝福语 🤍</p>
        </div>

        <!-- 网页内直接上传表单 -->
        <form id="weddingForm" onsubmit="handleDirectUpload(event)" class="space-y-4">
            <!-- 你的专属 Web3Forms Access Key -->
            <input type="hidden" name="access_key" value="038fd358-0782-4db5-94b9-da1e8f4bb99f">
            <input type="hidden" name="subject" value="来自婚礼宾客的新照片与祝福 📸">

            <!-- 姓名输入 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="nameLabel">您的姓名 *</label>
                <input type="text" id="guestName" name="Guest Name" required class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:ring-2 focus:ring-pink-400 focus:outline-none bg-white text-gray-800 text-sm shadow-sm" placeholder="请输入您的名字">
            </div>

            <!-- 祝福语输入 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="blessingLabel">新人祝福语</label>
                <textarea id="guestBlessing" name="Blessings" rows="3" class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:ring-2 focus:ring-pink-400 focus:outline-none bg-white text-gray-800 text-sm resize-none shadow-sm" placeholder="写下对新人的祝福..."></textarea>
            </div>

            <!-- 照片选择 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="photoLabel">选择照片 *</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-pink-300 rounded-xl cursor-pointer bg-pink-50/50 hover:bg-pink-100 transition-all text-center">
                        <svg class="w-6 h-6 text-pink-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span class="text-xs font-medium text-gray-700" data-i18n="albumBtn">相册选照片</span>
                        <input type="file" id="photoInput" name="attachment" accept="image/*" multiple class="hidden" onchange="handleFileSelect(this)">
                    </label>

                    <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-pink-300 rounded-xl cursor-pointer bg-pink-50/50 hover:bg-pink-100 transition-all text-center">
                        <svg class="w-6 h-6 text-pink-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span class="text-xs font-medium text-gray-700" data-i18n="cameraBtn">现场拍照</span>
                        <input type="file" id="cameraInput" name="attachment_cam" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelect(this)">
                    </label>
                </div>
                <div id="filePreview" class="mt-2 text-xs font-medium text-center text-pink-600"></div>
            </div>

            <!-- 提交按钮 -->
            <button type="submit" id="submitBtn" class="w-full custom-btn text-white font-medium py-3.5 px-6 rounded-xl shadow-md transition-all text-center block cursor-pointer text-base" data-i18n="submitBtn">
                确认并上传
            </button>
        </form>

        <!-- 成功上传后的精美提示区（默认隐藏） -->
        <div id="successView" class="hidden text-center py-6 space-y-4">
            <div class="w-14 h-14 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center mx-auto text-3xl font-bold shadow-inner">✓</div>
            <h2 class="serif-font text-2xl font-bold text-gray-800" data-i18n="successTitle">上传成功！</h2>
            <p class="text-sm text-gray-600" data-i18n="successDesc">感谢您的祝福与美好照片，新郎新妇已收到 🤍</p>
            <button onclick="resetForm()" class="mt-4 px-6 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium rounded-full transition-all">
                上传更多照片 / Upload More
            </button>
        </div>
    </div>

    <script>
        const translations = {
            zh: {
                subtitle: "Wedding Memories",
                desc: "欢迎分享您的美好瞬间，留下祝福语 🤍",
                nameLabel: "您的姓名 *",
                blessingLabel: "新人祝福语",
                photoLabel: "选择照片 *",
                albumBtn: "相册选照片",
                cameraBtn: "现场拍照",
                submitBtn: "确认并上传",
                successTitle: "上传成功！",
                successDesc: "感谢您的祝福与美好照片，新郎新妇已收到 🤍",
                nameAlert: "请先填写您的姓名！",
                selectAlert: "请至少选择或拍摄一张照片！",
                uploading: "⏳ 正在上传中，请稍候..."
            },
            en: {
                subtitle: "Wedding Memories",
                desc: "Share your wonderful moments & wishes 🤍",
                nameLabel: "Your Name *",
                blessingLabel: "Wedding Blessings",
                photoLabel: "Upload Photos *",
                albumBtn: "From Album",
                cameraBtn: "Take Photo",
                submitBtn: "Upload Photos",
                successTitle: "Uploaded Successfully!",
                successDesc: "Thank you for your lovely wishes and photos 🤍",
                nameAlert: "Please enter your name!",
                selectAlert: "Please select or take at least one photo!",
                uploading: "⏳ Uploading, please wait..."
            }
        };

        let currentLang = 'zh';
        let hasFiles = false;

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('lang-zh').className = lang === 'zh' ? 'px-2 py-1 rounded-full bg-pink-400 text-white transition-all' : 'px-2 py-1 rounded-full text-gray-600 transition-all';
            document.getElementById('lang-en').className = lang === 'en' ? 'px-2 py-1 rounded-full bg-pink-400 text-white transition-all' : 'px-2 py-1 rounded-full text-gray-600 transition-all';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            document.getElementById('guestName').placeholder = lang === 'zh' ? '请输入您的名字' : 'Enter your name';
            document.getElementById('guestBlessing').placeholder = lang === 'zh' ? '写下对新人的祝福...' : 'Leave your wishes here...';
        }

        function handleFileSelect(input) {
            if (input.files && input.files.length > 0) {
                hasFiles = true;
                const count = input.files.length;
                const previewText = currentLang === 'zh' ? `✅ 已成功选择 ${count} 张照片` : `✅ ${count} photo(s) selected`;
                document.getElementById('filePreview').textContent = previewText;
            }
        }

        async function handleDirectUpload(event) {
            event.preventDefault();
            const name = document.getElementById('guestName').value.trim();
            if (!name) {
                alert(translations[currentLang].nameAlert);
                return;
            }
            if (!hasFiles) {
                alert(translations[currentLang].selectAlert);
                return;
            }

            const btn = document.getElementById('submitBtn');
            const originalText = btn.textContent;
            btn.textContent = translations[currentLang].uploading;
            btn.disabled = true;

            const formElement = document.getElementById('weddingForm');
            const formData = new FormData(formElement);

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    formElement.style.display = 'none';
                    document.getElementById('successView').style.display = 'block';
                } else {
                    alert("上传遇到一点小问题，请重试：" + (data.message || ''));
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert("网络连接出错，请检查网络后重试。");
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        function resetForm() {
            document.getElementById('weddingForm').reset();
            document.getElementById('filePreview').textContent = '';
            hasFiles = false;
            document.getElementById('successView').style.display = 'none';
            document.getElementById('weddingForm').style.display = 'block';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').textContent = translations[currentLang].submitBtn;
        }
    </script>
</body>
</html>
